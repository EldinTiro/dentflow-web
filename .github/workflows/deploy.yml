name: Deploy to Production

on:
  push:
    branches: [main]

# One deploy at a time, in push order. Two merges a few seconds apart ran in
# parallel; the older build pushed :latest last and production ran it (2026-11-01).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/eldintiro/dentflow-web

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The build the app shows at the foot of the sidebar
      - name: Build time
        run: echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ env.BUILT_AT }}
            APP_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # VITE_API_URL nije potreban u produkciji:
          # Nginx proksira /api/* → api:8080 interno (same-origin, nema CORS)

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /app
            docker compose -f docker-compose.prod.yml --env-file .env pull frontend
            docker compose -f docker-compose.prod.yml --env-file .env up -d frontend
            docker image prune -f
            echo "Frontend deployed: $(date)"
