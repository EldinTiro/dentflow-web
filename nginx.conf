# nginx config for SPA — hands all routes to index.html
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Uploads: the API allows 20 MB per file (Document.TooLarge); a little headroom for
        # the multipart envelope. nginx's default of 1 MB refused ordinary phone photos.
        client_max_body_size 21m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
